name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    # NOTE: macos-14 (arm64) is not available for this account ("configuration not supported").
    # macos-15 is the arm64 image that works and matches the deploy_arm64 IL2CPP toolchain.
    runs-on: macos-15
    timeout-minutes: 120

    env:
      SCHEME: Unity-iPhone
      APP_NAME: NroThcTnh

    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-objects-${{ hashFiles('.gitattributes') }}

      - name: Fetch LFS objects
        run: |
          git lfs install --local
          git lfs pull
          git lfs ls-files --size | tail -n 5
          test -s Libraries/libiPhone-lib.a
          test -s Libraries/libil2cpp.a

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore executable bits (IL2CPP toolchain)
        run: |
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/il2cpp || true
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/bee_backend/mac-arm64/bee_backend || true
          chmod +x process_symbols.sh || true

      - name: Build (unsigned, arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package .ipa
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP=$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -print -quit)
          echo "App: $APP"
          test -n "$APP"
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          IPA="$RUNNER_TEMP/${APP_NAME}-unsigned.ipa"
          ( cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload )
          ls -lh "$IPA"
          /usr/bin/unzip -l "$IPA" | head -n 5

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore